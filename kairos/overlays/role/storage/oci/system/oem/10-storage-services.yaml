#cloud-config
name: "K2 storage services"

# ZFS + LIO service wiring for the storage appliance.
#
# Pool import is scan-based (zfs-import-scan) so the appliance carries no
# import state that a Kairos reset could lose: the pool on the data disks is
# the source of truth (design D5). zfs-import-cache stays harmlessly enabled
# via its zpool.cache existence condition.
#
# /etc is ephemeral on Kairos, so the LIO configuration that targetcli
# auto-saves to /etc/rtslib-fb-target/saveconfig.json must live on
# COS_PERSISTENT via a custom bind mount (design D6). /etc/zfs is persisted
# for zfs-list.cache / mount-generator state.

stages:
  rootfs:
    - name: "Persist LIO and ZFS state directories"
      environment_file: /run/cos/cos-layout.env
      environment:
        CUSTOM_BIND_MOUNTS: "/etc/rtslib-fb-target /etc/zfs"

  initramfs:
    # zgenhostid bakes a RANDOM hostid into each image build, so the value
    # differs between image revisions — not just A/B slots. A pool imported
    # under the old hostid then reads as "last accessed by another system"
    # after any upgrade and refuses to auto-import (recovered only by
    # `zpool import -f`). Pin the first hostid this machine ever used on
    # COS_PERSISTENT and restore it before zfs-import-scan runs, so the
    # pool's stored hostid keeps matching for the life of the appliance.
    - name: "Pin ZFS hostid across image revisions"
      if: '[ ! -f "/run/cos/recovery_mode" ]'
      commands:
        - |
          set -eu
          persisted=/usr/local/.state/hostid
          if [ -s "$persisted" ]; then
            cp "$persisted" /etc/hostid
          elif [ -s /etc/hostid ]; then
            install -d -m 0755 /usr/local/.state
            cp /etc/hostid "$persisted"
          fi
    - name: "Enable K2 storage services"
      if: '[ ! -f "/run/cos/recovery_mode" ]'
      systemctl:
        enable:
          - zfs-import-scan.service
          - k2-zfs-load-key.service
          - zfs-mount.service
          - zfs-volume-wait.service
          - zfs.target
          - k2-iscsi-firewall.service
          - rtslib-fb-targetctl.service
          - k2-storage-health.timer
          - k2-metrics.timer
          - k2-image-check.timer
          - k2-snapshot-hourly.timer
          - k2-snapshot-daily.timer
          - prometheus-node-exporter.service
