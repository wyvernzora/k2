build:
  aptPackages:
    - nftables
    - prometheus-node-exporter
    - smartmontools
    - targetcli-fb
    - zfsutils-linux
  postInstall:
    - zfs-hostid
    - disable-motd

inspect:
  oci:
    files:
      - path: /system/oem/10-storage-services.yaml
        structuredTests:
          - op: test
            path: /name
            value: K2 storage services
          - op: test
            path: /stages/rootfs/0/environment_file
            value: /run/cos/cos-layout.env
          - op: test
            path: /stages/rootfs/0/environment/CUSTOM_BIND_MOUNTS
            value: /etc/rtslib-fb-target /etc/zfs
          - op: test
            path: /stages/initramfs/0/name
            value: Pin ZFS hostid across image revisions
          - op: test
            path: /stages/initramfs/1/name
            value: Enable K2 storage services
          - op: test
            path: /stages/initramfs/1/systemctl/enable/0
            value: zfs-import-scan.service
          - op: test
            path: /stages/initramfs/1/systemctl/enable/1
            value: k2-zfs-load-key.service
          # The firewall must stay ahead of the target service in this list so
          # the portal guard is enabled alongside what it guards.
          - op: test
            path: /stages/initramfs/1/systemctl/enable/5
            value: k2-iscsi-firewall.service
          - op: test
            path: /stages/initramfs/1/systemctl/enable/6
            value: rtslib-fb-targetctl.service
          - op: test
            path: /stages/initramfs/1/systemctl/enable/8
            value: k2-metrics.timer
          - op: test
            path: /stages/initramfs/1/systemctl/enable/9
            value: k2-image-check.timer
          - op: test
            path: /stages/initramfs/1/systemctl/enable/10
            value: k2-snapshot-hourly.timer
          - op: test
            path: /stages/initramfs/1/systemctl/enable/11
            value: k2-snapshot-daily.timer
          - op: test
            path: /stages/initramfs/1/systemctl/enable/12
            value: prometheus-node-exporter.service
      - path: /etc/systemd/system/k2-zfs-load-key.service
        contains:
          - "ExecStart=/usr/sbin/zfs load-key -a"
          - "Before=zfs-volume-wait.service zfs-mount.service"
      - path: /etc/systemd/system/k2-iscsi-firewall.service
        contains:
          - "Before=rtslib-fb-targetctl.service"
          - "ExecStart=/usr/sbin/nft -f /etc/nftables/k2-iscsi.nft"
      # The guard itself: 3260 reachable on the fabric, dropped everywhere
      # else. Asserted literally because a silently-empty ruleset would leave
      # the portal open on the LAN leg and nothing else would notice.
      - path: /etc/nftables/k2-iscsi.nft
        contains:
          - "elements = { 172.16.0.0/16 }"
          - "tcp dport 3260 ip daddr @iscsi_portal_dst accept"
          - "tcp dport 3260 drop"
      - path: /etc/systemd/system/rtslib-fb-targetctl.service.d/10-k2-after-zfs.conf
        contains:
          - "After=zfs.target zfs-volume-wait.service"
          - "Wants=zfs-volume-wait.service"
      - path: /etc/systemd/system/k2-storage-health.service
        contains:
          - "ExecStart=/usr/sbin/k2-node-agent storage-health"
      - path: /etc/systemd/system/k2-storage-health.timer
        contains:
          - "OnUnitActiveSec=1h"
      - path: /etc/systemd/system/k2-metrics.service
        contains:
          - "Type=oneshot"
          - "ExecStart=/usr/sbin/k2-node-agent metrics"
      - path: /etc/systemd/system/k2-metrics.timer
        contains:
          - "OnBootSec=1min"
      - path: /etc/systemd/system/k2-image-check.service
        contains:
          - "ConditionPathExists=!/run/cos/recovery_mode"
          - "Type=oneshot"
          - "ExecStart=/usr/sbin/k2-node-agent image-check"
      - path: /etc/systemd/system/k2-image-check.timer
        contains:
          - "OnCalendar=hourly"
          - "Persistent=true"
          - "RandomizedDelaySec=10min"
      - path: /etc/systemd/system/k2-snapshot-hourly.service
        contains:
          - "EnvironmentFile=-/oem/k2-snapshot.env"
          - "--prefix k2-hourly --keep ${K2_SNAPSHOT_HOURLY_KEEP}"
      - path: /etc/systemd/system/k2-snapshot-hourly.timer
        contains:
          - "OnCalendar=hourly"
          - "Persistent=true"
      - path: /etc/systemd/system/k2-snapshot-daily.service
        contains:
          - "--prefix k2-daily --keep ${K2_SNAPSHOT_DAILY_KEEP}"
      - path: /etc/systemd/system/k2-snapshot-daily.timer
        contains:
          - "OnCalendar=daily"
      - path: /etc/issue
        contains:
          - K2 Storage Appliance
      # Baked by the zfs-hostid post-install action (zgenhostid): a stable ZFS
      # hostid identical across A/B slots so pool import never looks foreign.
      - path: /etc/hostid
    absent:
      - /etc/rancher
      - /etc/systemd/system/k3s.service
      - /etc/systemd/system/k3s-agent.service
      - /system/oem/05-persistent-storage.yaml
      - /usr/share/k2/node-provision
    commands:
      - nft
      - sshd
      - targetcli
      - targetctl
      - k2-node-agent
      - prometheus-node-exporter
      - smartctl
      - zfs
      - zgenhostid
      - zpool
