apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/instance: kube-vip
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: kube-vip
    app.kubernetes.io/version: v1.2.2
    helm.sh/chart: kube-vip-0.11.0
    k2.wyvernzora.io/app: kube-vip
    k2.wyvernzora.io/component: kube-vip
  name: kube-vip
  namespace: kube-vip
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-vip
subjects:
  - kind: ServiceAccount
    name: kube-vip
    namespace: kube-vip
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    k2.wyvernzora.io/app: kube-vip
    k2.wyvernzora.io/component: kube-vip
  name: kube-vip
  namespace: kube-vip
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: kube-vip
      app.kubernetes.io/name: kube-vip
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: kube-vip
        app.kubernetes.io/name: kube-vip
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      containers:
        - args:
            - manager
          env:
            - name: vip_address
              value: 10.10.9.1
            - name: KUBERNETES_SERVICE_HOST
              value: 127.0.0.1
            - name: KUBERNETES_SERVICE_PORT
              value: "6443"
            - name: cp_enable
              value: "true"
            - name: lb_enable
              value: "true"
            - name: lb_port
              value: "6443"
            - name: prometheus_server
              value: :2112
            - name: svc_election
              value: "false"
            - name: svc_enable
              value: "false"
            - name: vip_arp
              value: "true"
            - name: vip_interface
              value: end0
            - name: vip_leaderelection
              value: "true"
            - name: vip_subnet
              value: "32"
          image: ghcr.io/kube-vip/kube-vip:v1.2.2
          imagePullPolicy: IfNotPresent
          name: kube-vip
          resources:
            limits:
              cpu: 200m
              memory: 200Mi
            requests:
              cpu: 50m
              memory: 100Mi
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
              drop:
                - ALL
      hostNetwork: true
      serviceAccountName: kube-vip
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
        - key: CriticalAddonsOnly
          operator: Exists
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
---
