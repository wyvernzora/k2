# Durable identity for storage appliance k2-st-0e12 (shuna VM 220).
# Loaded by k2-tools provision storage via --node-name.

# LAN/management leg: pinned in-guest; 10.10.9.x sits below the VLAN10
# DHCP pool floor (10.10.100.1). Clean-node first boot DHCPs on this NIC.
[[nic]]
iface = "ens18"
address = "10.10.9.250/16"
gateway = "10.10.1.1"
dns = ["10.10.10.10", "1.1.1.1"]

# Storage fabric leg (vmbr1): iSCSI portal address. No gateway/DNS by
# design — unrouted bridge. MTU deliberately unset; set to 9000 in
# lockstep with the bridge when the 100G DAC is enslaved.
[[nic]]
iface = "ens19"
address = "172.16.9.250/16"
