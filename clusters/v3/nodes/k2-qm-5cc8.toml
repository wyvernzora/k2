# Durable identity for worker k2-qm-5cc8. Loaded by k2-tools provision via
# --node-name; nodes without a file provision with DHCP.

# LAN leg: pinned in-guest; 10.10.9.x sits below the VLAN10 DHCP pool
# floor (10.10.100.1), so no reservation conflict.
[[nic]]
iface = "ens18"
address = "10.10.9.228/16"
gateway = "10.10.1.1"
dns = ["10.10.10.10", "1.1.1.1"]

# Storage fabric leg (vmbr1): no gateway/DNS by design — unrouted bridge.
# Jumbo MTU matches vmbr1 and the 100G DAC to the NAS.
[[nic]]
iface = "ens19"
address = "172.16.9.228/16"
mtu = 9000
