name: Runtime Images

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Earthfile"
      - "images/**"
      - ".github/workflows/images.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "Earthfile"
      - "images/**"
      - ".github/workflows/images.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: Resolve images
    runs-on: ubuntu-26.04
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed image inputs
        id: changes
        shell: bash
        run: |
          force_all=false
          : >/tmp/k2-runtime-image-changed-files.txt

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            force_all=true
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" > /tmp/k2-runtime-image-changed-files.txt
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            before="${{ github.event.before }}"
            if [[ "$before" =~ ^0+$ ]]; then
              force_all=true
            elif ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              echo "Previous commit ${before} not present; treating as full image rebuild." >&2
              force_all=true
            else
              git diff --name-only "$before" "${{ github.sha }}" > /tmp/k2-runtime-image-changed-files.txt
            fi
          fi

          if grep -Eq "^(\.github/workflows/images\.yaml|images/scripts/)" /tmp/k2-runtime-image-changed-files.txt; then
            force_all=true
          fi

          echo "force_all=${force_all}" >> "$GITHUB_OUTPUT"
          echo "Changed image inputs:"
          sed 's/^/  /' /tmp/k2-runtime-image-changed-files.txt || true

      - name: Resolve image matrix
        id: images
        shell: bash
        run: |
          images=$(bash images/scripts/resolve-ci-images.sh \
            /tmp/k2-runtime-image-changed-files.txt \
            "${{ steps.changes.outputs.force_all }}")
          echo "Image matrix:"
          echo "${images}" | jq .
          echo "images=${images}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: images
    if: needs.images.outputs.images != '[]'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.images.outputs.images) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:latest
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Earthly
        uses: earthly/actions-setup@v1
        with:
          version: v0.8.14

      - name: Resolve tags
        id: tags
        shell: bash
        run: |
          short_sha="${GITHUB_SHA:0:12}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            tag="pr-${{ github.event.pull_request.number }}-${short_sha}"
          else
            tag="sha-${short_sha}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${{ matrix.versionTag }}" >> "$GITHUB_OUTPUT"
          echo "latest=${{ matrix.latestOnMain }}" >> "$GITHUB_OUTPUT"

      - name: Build image
        shell: bash
        run: |
          push=()
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            push+=(--push)
          fi
          earthly "${push[@]}" "${{ matrix.earthlyTarget }}" \
            --TAG="${{ steps.tags.outputs.tag }}" --REVISION="$GITHUB_SHA"

      - name: Verify immutable image
        if: github.event_name != 'pull_request'
        id: published
        shell: bash
        run: |
          image="${{ matrix.image }}"
          docker buildx imagetools inspect "$image:${{ steps.tags.outputs.tag }}" --raw > /tmp/runtime-index.json
          jq -e '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]' /tmp/runtime-index.json
          digest="sha256:$(sha256sum /tmp/runtime-index.json | cut -d ' ' -f 1)"
          while IFS= read -r child; do
            docker buildx imagetools inspect "$image@$child" --format '{{json .Image}}' |
              jq -e --arg revision "$GITHUB_SHA" '.config.Labels["org.opencontainers.image.revision"] == $revision'
          done < <(jq -r '.manifests[].digest' /tmp/runtime-index.json)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Publish mutable tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          image="${{ matrix.image }}"
          digest="${{ steps.published.outputs.digest }}"
          tags=()
          if [[ "${{ steps.tags.outputs.latest }}" == "true" ]]; then
            tags+=(latest)
          fi
          if [[ -n "${{ steps.tags.outputs.version_tag }}" ]]; then
            tags+=("${{ steps.tags.outputs.version_tag }}")
          fi
          for tag in "${tags[@]}"; do
            docker buildx imagetools create --tag "$image:$tag" "$image@$digest"
            actual="sha256:$(docker buildx imagetools inspect "$image:$tag" --raw | sha256sum | cut -d ' ' -f 1)"
            test "$actual" = "$digest"
          done

      # Platform manifests are untagged but referenced by published indexes.
      # Package cleanup must preserve those references before it can be enabled.
