#cloud-config
name: "K2 iSCSI initiator"

# Kubernetes CSI initiators need a stable, node-unique IQN. /etc is ephemeral
# on Kairos, while the open-iscsi package creates initiatorname.iscsi during
# image build (and therefore gives every clone the same value). Persist the
# directory so sessions and node records survive, but keep the IDENTITY in K2
# state and re-render it every boot.
#
# Identity cannot live in /etc/iscsi even though that directory is persisted:
# an upgrade syncs the new image's /etc over the persisted copy, so the baked
# initiatorname.iscsi wins while any marker file next to it survives — a
# write-once guard therefore never re-fires and every node upgraded from one
# image ends up answering to the SAME IQN. Observed live on 2026-08-11: two
# nodes upgraded to 986edfe8 both took their image's baked value.

stages:
  rootfs:
    - name: "Persist iSCSI initiator state"
      environment_file: /run/cos/cos-layout.env
      environment:
        CUSTOM_BIND_MOUNTS: "/etc/iscsi"

  initramfs:
    - name: "Initialize K2 iSCSI initiator"
      if: '[ ! -f "/run/cos/recovery_mode" ]'
      commands:
        - |
          state=/usr/local/.state/k2-iscsi-iqn
          initiator=/etc/iscsi/initiatorname.iscsi
          if [ ! -s "$state" ]; then
            install -d -m 0755 /usr/local/.state
            /usr/sbin/iscsi-iname > "$state"
          fi
          install -d -m 0755 /etc/iscsi
          umask 022
          printf "InitiatorName=%s\n" "$(cat "$state")" > "$initiator"
      systemctl:
        enable:
          - iscsid.service
    - name: "Enable K2 node metrics timers"
      if: '[ ! -f "/run/cos/recovery_mode" ]'
      systemctl:
        enable:
          - k2-metrics.timer
          - k2-image-check.timer
