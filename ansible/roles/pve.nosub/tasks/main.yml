---
- name: Validate supported Proxmox base release
  assert:
    that:
      - ansible_distribution == "Debian"
      - ansible_distribution_release in ["bookworm", "trixie"]
    fail_msg: >-
      pve.nosub supports Proxmox VE 8 on Debian bookworm and Proxmox VE 9 on
      Debian trixie; found {{ ansible_distribution }} {{ ansible_distribution_release }}.

- name: Configure Proxmox no-subscription repository
  template:
    src: proxmox.sources.j2
    dest: /etc/apt/sources.list.d/proxmox.sources
    owner: root
    group: root
    mode: "0644"
  register: __pve_no_subscription_repo

- name: Remove enterprise and unused Ceph repositories
  file:
    path: "/etc/apt/sources.list.d/{{ item }}"
    state: absent
  loop:
    - pve-enterprise.sources
    - pve-enterprise.list
    - ceph.sources
    - ceph.list
    - download_proxmox_com_debian_pve.list
    - download_proxmox_com_debian_ceph_quincy.list
    - download_proxmox_com_debian_ceph_reef.list
    - download_proxmox_com_debian_ceph_squid.list
    - enterprise_proxmox_com_debian_pve.list
    - enterprise_proxmox_com_debian_ceph_quincy.list
    - enterprise_proxmox_com_debian_ceph_reef.list
    - enterprise_proxmox_com_debian_ceph_squid.list
  register: __pve_removed_repositories

- name: Refresh APT metadata
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade packages after changing repository channels
  apt:
    update_cache: true
    upgrade: dist
  when: >-
    __pve_no_subscription_repo.changed or
    (__pve_removed_repositories.results | selectattr('changed') | list | length > 0)

- name: Check for legacy subscription-warning patch
  stat:
    path: /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js
  register: __pve_proxmoxlib

- name: Remove legacy subscription-warning patch
  lineinfile:
    path: /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js
    regexp: '^\/\*!do-not-nag!\*\/.*$'
    state: absent
  when: __pve_proxmoxlib.stat.exists
  notify: restart pveproxy
