apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/component: node-linux
    app.kubernetes.io/csi-role: node
    app.kubernetes.io/instance: democratic-csi
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: democratic-csi
    helm.sh/chart: democratic-csi-0.15.1
    k2.wyvernzora.io/app: democratic-csi
    k2.wyvernzora.io/component: democratic-csi
  name: democratic-csi-node
  namespace: democratic-csi
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: node-linux
      app.kubernetes.io/csi-role: node
      app.kubernetes.io/instance: democratic-csi
      app.kubernetes.io/managed-by: Helm
      app.kubernetes.io/name: democratic-csi
  template:
    metadata:
      annotations:
        checksum/configmap: 541936c0b6604ba82cb0d61ff7fd5bb8dacbf3647ddef67d962e08dc64b55592
      labels:
        app.kubernetes.io/component: node-linux
        app.kubernetes.io/csi-role: node
        app.kubernetes.io/instance: democratic-csi
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: democratic-csi
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: kubernetes.io/os
                    operator: In
                    values:
                      - linux
      containers:
        - args:
            - --csi-version=1.5.0
            - --csi-name=org.democratic-csi.iscsi
            - --driver-config-file=/config/driver-config-file.yaml
            - --log-level=info
            - --csi-mode=node
            - --server-socket=/csi-data/csi.sock.internal
          env:
            - name: CSI_NODE_ID
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
            - name: NODE_EXTRA_CA_CERTS
              value: /tmp/certs/extra-ca-certs.crt
          image: ghcr.io/democratic-csi/democratic-csi:latest
          livenessProbe:
            exec:
              command:
                - bin/liveness-probe
                - --csi-version=1.5.0
                - --csi-address=/csi-data/csi.sock.internal
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 60
            timeoutSeconds: 15
          name: csi-driver
          securityContext:
            allowPrivilegeEscalation: true
            capabilities:
              add:
                - SYS_ADMIN
            privileged: true
          terminationMessagePath: /tmp/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /csi-data
              name: socket-dir
            - mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
              name: kubelet-dir
            - mountPath: /etc/iscsi
              mountPropagation: Bidirectional
              name: iscsi-dir
            - mountPath: /var/lib/iscsi
              mountPropagation: Bidirectional
              name: iscsi-info
            - mountPath: /lib/modules
              name: modules-dir
              readOnly: true
            - mountPath: /etc/localtime
              name: localtime
              readOnly: true
            - mountPath: /run/udev
              name: udev-data
            - mountPath: /host
              mountPropagation: Bidirectional
              name: host-dir
            - mountPath: /sys
              name: sys-dir
            - mountPath: /dev
              name: dev-dir
            - mountPath: /config
              name: config
            - mountPath: /tmp/certs
              name: extra-ca-certs
        - env:
            - name: BIND_TO
              value: unix:///csi-data/csi.sock
            - name: PROXY_TO
              value: unix:///csi-data/csi.sock.internal
          image: ghcr.io/democratic-csi/csi-grpc-proxy:v0.5.7
          name: csi-proxy
          volumeMounts:
            - mountPath: /csi-data
              name: socket-dir
        - args:
            - --v=5
            - --csi-address=/csi-data/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/org.democratic-csi.iscsi/csi.sock
          env:
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.9.0
          livenessProbe:
            exec:
              command:
                - /csi-node-driver-registrar
                - --kubelet-registration-path=/var/lib/kubelet/plugins/org.democratic-csi.iscsi/csi.sock
                - --mode=kubelet-registration-probe
          name: driver-registrar
          volumeMounts:
            - mountPath: /csi-data
              name: socket-dir
            - mountPath: /registration
              name: registration-dir
            - mountPath: /var/lib/kubelet
              name: kubelet-dir
        - args:
            - while true; do sleep 2; done;
          command:
            - /bin/sh
            - -c
            - --
          image: docker.io/busybox:1.37.0
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - rm -rf /plugins/org.democratic-csi.iscsi /registration/org.democratic-csi.iscsi-reg.sock
          name: cleanup
          volumeMounts:
            - mountPath: /plugins
              name: plugins-dir
            - mountPath: /registration
              name: registration-dir
      dnsPolicy: ClusterFirstWithHostNet
      hostAliases: []
      hostIPC: true
      hostNetwork: true
      hostPID: false
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName: system-node-critical
      serviceAccount: democratic-csi-node-sa
      volumes:
        - hostPath:
            path: /var/lib/kubelet/plugins/org.democratic-csi.iscsi
            type: DirectoryOrCreate
          name: socket-dir
        - hostPath:
            path: /var/lib/kubelet/plugins
            type: Directory
          name: plugins-dir
        - hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: DirectoryOrCreate
          name: registration-dir
        - hostPath:
            path: /var/lib/kubelet
            type: Directory
          name: kubelet-dir
        - hostPath:
            path: /etc/iscsi
            type: DirectoryOrCreate
          name: iscsi-dir
        - hostPath:
            path: /var/lib/iscsi
          name: iscsi-info
        - hostPath:
            path: /dev
            type: Directory
          name: dev-dir
        - hostPath:
            path: /lib/modules
          name: modules-dir
        - hostPath:
            path: /etc/localtime
          name: localtime
        - hostPath:
            path: /run/udev
          name: udev-data
        - hostPath:
            path: /sys
            type: Directory
          name: sys-dir
        - hostPath:
            path: /
            type: Directory
          name: host-dir
        - name: config
          secret:
            secretName: democratic-csi-driver-config
        - configMap:
            items:
              - key: extra-ca-certs
                path: extra-ca-certs.crt
            name: democratic-csi
          name: extra-ca-certs
