---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: snapshot-controller
    app.kubernetes.io/instance: snapshot-controller
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: snapshot-controller
    helm.sh/chart: snapshot-controller-0.3.0
    k2.wyvernzora.io/app: snapshot-controller
    k2.wyvernzora.io/component: snapshot-controller
  name: snapshot-controller
  namespace: snapshot-controller
spec:
  minReadySeconds: 35
  replicas: 3
  selector:
    matchLabels:
      app: snapshot-controller
      app.kubernetes.io/instance: snapshot-controller
      app.kubernetes.io/managed-by: Helm
      app.kubernetes.io/name: snapshot-controller
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: snapshot-controller
        app.kubernetes.io/instance: snapshot-controller
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: snapshot-controller
    spec:
      containers:
        - args:
            - --v=5
            - --leader-election=true
            - --enable-distributed-snapshotting
          image: registry.k8s.io/sig-storage/snapshot-controller:v8.2.1
          imagePullPolicy: IfNotPresent
          name: snapshot-controller
      serviceAccount: snapshot-controller
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  labels:
    k2.wyvernzora.io/app: snapshot-controller
    k2.wyvernzora.io/component: network-policy
  name: snapshot-controller-snapshot-controller-access
specs:
  - egress:
      - toEntities:
          - kube-apiserver
      - toEndpoints:
          - matchLabels:
              k8s-app: kube-dns
              k8s:io.kubernetes.pod.namespace: kube-system
        toPorts:
          - ports:
              - port: "53"
                protocol: UDP
              - port: "53"
                protocol: TCP
            rules:
              dns:
                - matchPattern: "*"
    endpointSelector:
      matchLabels:
        k8s:io.kubernetes.pod.namespace: snapshot-controller
