          name: csi-proxy
          volumeMounts:
            - mountPath: /csi-data
              name: socket-dir
      dnsPolicy: ClusterFirst
      hostAliases: []
      hostIPC: false
      hostNetwork: false
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName: system-cluster-critical
      serviceAccount: democratic-csi-controller-sa
      volumes:
        - emptyDir: {}
          name: socket-dir
        - name: config
          secret:
            secretName: democratic-csi-driver-config
        - configMap:
            items:
              - key: extra-ca-certs
                path: extra-ca-certs.crt
            name: democratic-csi
          name: extra-ca-certs
