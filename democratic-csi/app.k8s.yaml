apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  labels:
    k2.wyvernzora.io/app: democratic-csi
    k2.wyvernzora.io/component: democratic-csi
  name: democratic-csi-driver-config
  namespace: democratic-csi
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: a5lkltqnv43tdtbfn6gayexafq/csiPrivateKey
        metadataPolicy: None
        nullBytePolicy: Ignore
      secretKey: csiPrivateKey
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: a5lkltqnv43tdtbfn6gayexafq/chapUsername
        metadataPolicy: None
        nullBytePolicy: Ignore
      secretKey: chapUsername
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: a5lkltqnv43tdtbfn6gayexafq/chapPassword
        metadataPolicy: None
        nullBytePolicy: Ignore
      secretKey: chapPassword
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: democratic-csi-driver-config
    template:
      data:
        driver-config-file.yaml: |
          driver: zfs-generic-iscsi
          sshConnection:
            host: 172.16.9.250
            port: 22
            username: k2-csi
            privateKey: {{ .csiPrivateKey | toJson }}
          zfs:
            cli:
              sudoEnabled: true
            datasetParentName: tank/csi/k2
            detachedSnapshotsDatasetParentName: tank/csi/k2-snapshots
            zvolEnableReservation: false
            zvolBlocksize: "16K"
          iscsi:
            shareStrategy: targetCli
            shareStrategyTargetCli:
              sudoEnabled: true
              basename: iqn.2026-07.io.wyvernzora.k2:storage
              tpg:
                attributes:
                  authentication: 1
                  generate_node_acls: 1
                  cache_dynamic_acls: 1
                  demo_mode_write_protect: 0
                auth:
                  userid: {{ .chapUsername | toJson }}
                  password: {{ .chapPassword | toJson }}
              block:
                attributes:
                  emulate_tpu: 1
            targetPortal: 172.16.9.250:3260
---
apiVersion: external-secrets.io/v1
