        key: a5lkltqnv43tdtbfn6gayexafq/csiPrivateKey
        metadataPolicy: None
        nullBytePolicy: Ignore
      secretKey: csiPrivateKey
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: a5lkltqnv43tdtbfn6gayexafq/chapUsername
        metadataPolicy: None
        nullBytePolicy: Ignore
      secretKey: chapUsername
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: a5lkltqnv43tdtbfn6gayexafq/chapPassword
        metadataPolicy: None
        nullBytePolicy: Ignore
      secretKey: chapPassword
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
